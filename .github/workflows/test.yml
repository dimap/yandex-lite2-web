name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ['3.9', '3.14']
        include:
          - os: macos-latest
            python: '3.14'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m compileall -q server.py assistant.py profiles.py multi.py
      - run: python -m unittest discover -s tests -v
      - run: python server.py --help
      - run: python multi.py --help
      - run: |
          sh -n start.sh
          sh -n start.command
      - run: node tests/test_renderer.mjs
      - run: node tests/test_paths.mjs
      - run: node --check static/assistant.js
      - run: node tests/test_assistant_ui.mjs
      - run: sh -n device/assistant/service.sh && sh -n tools/build-assistant.sh

  assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - run: go -C device/assistant test -race ./...
      - run: go -C device/assistant vet ./...
      - run: sh tools/build-assistant.sh
