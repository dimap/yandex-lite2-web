name: release

# Метка vX.Y.Z → релиз на GitHub с готовыми ZIP для Windows (панель + портативный Python).
# Вручную (workflow_dispatch) — только собрать ZIP и приложить к запуску как артефакт.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: false
      - name: Метка совпадает с VERSION
        if: github.ref_type == 'tag'
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)" || { echo "метка $GITHUB_REF_NAME, а в VERSION $(cat VERSION)"; exit 1; }
      - name: Сборка
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || VER="dev-${GITHUB_SHA::7}"
          tools/build-windows-zip.sh "$VER" amd64 dist
          tools/build-windows-zip.sh "$VER" arm64 dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip
      - name: Релиз
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --generate-notes --notes "$(cat <<'NOTES'
          **Windows:** скачайте `…-windows-x64.zip` (или `arm64` для ARM-ноутбуков), распакуйте и запустите `start.bat`.
          Python уже внутри; adb (и по желанию ffmpeg) `start.bat` скачает сам при первом запуске.

          **Linux / macOS / Docker:** см. README.
          NOTES
          )"
