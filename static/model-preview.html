@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#111116;--card:#1A1A21;--text:#EDEDF2;--muted:#9C9CAB;--border:#2A2A33;--accent:#8B6CFF;--accent-ink:#C2B3FF;--accent-soft:#2A2342}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#111116;--card:#1A1A21;--text:#EDEDF2;--muted:#9C9CAB;--border:#2A2A33;--accent:#8B6CFF;--accent-ink:#C2B3FF;--accent-soft:#2A2342}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px system-ui,sans-serif}main{max-width:1000px;margin:36px auto;padding:0 24px}h1{margin-bottom:8px;font-size:28px}p{color:var(--muted);line-height:1.5}label{display:block;font-size:12px;margin:24px 0 6px;color:var(--muted)}select{background:var(--card);color:var(--text);border:1px solid var(--border);padding:10px;border-radius:10px;min-width:180px}.model-view{position:relative;width:100%;height:520px;touch-action:none;cursor:grab;margin-top:16px;border:1px solid var(--border);border-radius:24px;background:radial-gradient(ellipse at center,var(--accent-soft),transparent 70%)}.model-view canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#model-viz{pointer-events:none}a{color:var(--accent-ink)}.badge{font-size:11px;letter-spacing:.09em;color:var(--accent-ink)}@media(max-width:600px){main{padding:0 16px}.model-view{height:400px}h1{font-size:23px}}</style>
